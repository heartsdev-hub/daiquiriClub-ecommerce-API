services:
  postgres:
    image: postgres:17
    container_name: daiquiriclub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:daiquiriclub-db}
      POSTGRES_USER: ${DB_USERNAME:postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:jack}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - daiquiriclub-network
  app:
    build:
        context: .
        dockerfile: Dockerfile
    container_name: daiquiriclub-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9090}:4040"
    environment:
        SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:dev}
        DB_URL: jdbc:postgresql://postgres:${DB_PORT:-5432}/${DB_NAME:daiquiriclub-db}
        DB_USERNAME: ${DB_USERNAME:postgres}
        DB_PASSWORD: ${DB_PASSWORD:jack}
        JWT_SECRET: ${JWT_SECRET}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      - postgres
    networks:
        - daiquiriclub-network


volumes:
  postgres-data:

networks:
    daiquiriclub-network:
        driver: bridge